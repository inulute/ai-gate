name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (optional - uses package.json if not provided)'
        required: false
      platform:
        description: 'Platform to build (linux, windows, macos, or all)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  # Resolves the tag once and makes sure a release exists to upload into, so the
  # build jobs can attach their artifacts directly instead of round-tripping
  # every file through the actions artifact store. Created as a draft: nothing
  # is publicly visible until the publish job runs, which only happens if every
  # platform succeeded.
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    outputs:
      tag_name: ${{ steps.version_info.outputs.tag_name }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build matrix
        id: set-matrix
        run: |
          PLATFORM="${{ inputs.platform }}"
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" == "all" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux"},{"os":"windows-2025","platform":"windows"},{"os":"macos-latest","platform":"macos"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "linux" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "windows" ]; then
            echo 'matrix={"include":[{"os":"windows-2025","platform":"windows"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "macos" ]; then
            echo 'matrix={"include":[{"os":"macos-latest","platform":"macos"}]}' >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Extract version info
        id: version_info
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          PRODUCT_NAME=$(node -e "console.log(require('./package.json').productName || 'AI Gate')")

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
          else
            TAG_NAME="v${VERSION}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "product_name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Release version: $VERSION"
          echo "Release tag: $TAG_NAME"
        shell: bash

      - name: Create or update tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version_info.outputs.tag_name }}
          git push -f origin ${{ steps.version_info.outputs.tag_name }}
        shell: bash

      # Hand-written release notes are preserved; only the draft flag is forced.
      # Doing that here rather than trusting whoever ran `gh release create` to
      # remember --draft is what makes the publish atomic: a rebuild goes back
      # to draft while it runs, so a failure part-way through cannot leave a
      # release showing only the platforms that happened to finish.
      - name: Ensure a draft release exists to upload into
        run: |
          TAG="${{ steps.version_info.outputs.tag_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; keeping its notes and moving it to draft for the rebuild."
            gh release edit "$TAG" --draft=true
          else
            echo "No release for $TAG yet; creating a draft placeholder."
            gh release create "$TAG" \
              --draft \
              --title "${{ steps.version_info.outputs.product_name }} $TAG" \
              --notes "See CHANGELOG.md for the notes for this release."
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-release.outputs.matrix) }}

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          PRODUCT_NAME=$(node -e "console.log(require('./package.json').productName || 'AI Gate')")
          APP_ID=$(node -e "console.log(require('./package.json').build && require('./package.json').build.appId || 'com.inulute.aigate')")
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "product_name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          
          echo "Building version: $VERSION"
          echo "Product name: $PRODUCT_NAME"
        shell: bash
      
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: |
          npx tsc -p tsconfig.electron.json
          npx tsc -p tsconfig.preload.json
      
      - name: Build Vite
        run: npx vite build
        env:
          NODE_ENV: production
      
      # One invocation per platform: the arch list lives in build.win.target and
      # build.mac.target. Passing --x64 and --arm64 as separate runs also built
      # a third, combined installer that duplicated both and shipped unsigned.
      - name: Build Electron - Windows
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish never
      
      - name: Build Electron - macOS
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --publish never
      
      # fpm shells out to bsdtar to write pacman archives; it is not on the
      # ubuntu runner image by default.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
        shell: bash

      - name: Build Electron - Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
      
      # Stage this platform's shippable files so the attest and upload steps get
      # a directory that exists on every runner, rather than globs that match
      # nothing off-platform.
      - name: Collect release files
        run: |
          mkdir -p release-files
          find release-builds -maxdepth 1 -type f \( -name "*-x64.exe" -o -name "*-arm64.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.pacman" \) -exec cp {} release-files/ \;
          echo "Files to publish:"
          ls -lah release-files
        shell: bash

      # Attested by the job that actually built the files, so the provenance
      # names the real producing runner.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release-files/*'

      - name: Upload assets to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: release-files/*
          fail_on_unmatched_files: true
          # Without this the upload clears the draft flag and publishes a
          # release holding only the platform that happened to finish first.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Everything is already attached to the draft by the build jobs; this only
  # makes it visible, and only once every platform succeeded.
  publish:
    name: Publish Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Publish the release
        run: |
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          echo "Assets attached to $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
