name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (optional - uses package.json if not provided)'
        required: false
      platform:
        description: 'Platform to build (linux, windows, macos, or all)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          PLATFORM="${{ inputs.platform }}"
          if [ -z "$PLATFORM" ] || [ "$PLATFORM" == "all" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux"},{"os":"windows-2025","platform":"windows"},{"os":"macos-latest","platform":"macos"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "linux" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "windows" ]; then
            echo 'matrix={"include":[{"os":"windows-2025","platform":"windows"}]}' >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "macos" ]; then
            echo 'matrix={"include":[{"os":"macos-latest","platform":"macos"}]}' >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: compute-matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          PRODUCT_NAME=$(node -e "console.log(require('./package.json').productName || 'AI Gate')")
          APP_ID=$(node -e "console.log(require('./package.json').build && require('./package.json').build.appId || 'com.inulute.aigate')")
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "product_name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          
          echo "Building version: $VERSION"
          echo "Product name: $PRODUCT_NAME"
        shell: bash
      
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci
      
      - name: Remove publish config from package.json
        run: |
          cp package.json package.json.bak
          node -e "const pkg = require('./package.json'); delete pkg.build.publish; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          echo "Modified package.json (publish config removed)"
        shell: bash
      
      - name: Build TypeScript
        run: |
          npx tsc -p tsconfig.electron.json
          npx tsc -p tsconfig.preload.json
      
      - name: Build Vite
        run: npx vite build
        env:
          NODE_ENV: production
      
      # One invocation per platform: the arch list lives in build.win.target and
      # build.mac.target. Passing --x64 and --arm64 as separate runs also built
      # a third, combined installer that duplicated both and shipped unsigned.
      - name: Build Electron - Windows
        if: matrix.platform == 'windows'
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron - macOS
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # fpm shells out to bsdtar to write pacman archives; it is not on the
      # ubuntu runner image by default.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
        shell: bash

      - name: Build Electron - Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-build
          path: |
            release-builds/*
            !release-builds/*.blockmap
            !release-builds/*.yaml
            !release-builds/builder-*.yml
          retention-days: 5
          compression-level: 6

  release:
    name: Create Release
    needs: [compute-matrix, build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write
      id-token: write
      attestations: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Extract version info
        id: version_info
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          PRODUCT_NAME=$(node -e "console.log(require('./package.json').productName || 'AI Gate')")

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "product_name=$PRODUCT_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          echo "Release version: $VERSION"
          echo "Release tag: $TAG_NAME"
        shell: bash
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p ./release-files
          
          echo "Artifact directories:"
          ls -la ./artifacts/
          
          find ./artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.pacman" \) -exec cp {} ./release-files/ \;
          
          cd ./release-files
          echo "Release files prepared:"
          ls -lah
        shell: bash
      
      - name: Create or update tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version_info.outputs.tag_name }}
          git push -f origin ${{ steps.version_info.outputs.tag_name }}
        shell: bash
      
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: './release-files/*'

      - name: Upload assets to GitHub Release
        # Only uploads build artifacts — release notes are written manually via
        # `gh release create` before tagging, so we don't touch the body here.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          files: |
            ./release-files/*.exe
            ./release-files/*.dmg
            ./release-files/*.zip
            ./release-files/*.AppImage
            ./release-files/*.deb
            ./release-files/*.pacman
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}